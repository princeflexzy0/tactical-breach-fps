# threejs-fps-02: the second running of "make the best three.js tactical FPS", judged by the house AI judge on a
# dossier (program/v1 + harness.judge, media dossier). It carries threejs-fps-01's sealed trees byte for byte: the same
# task, scorer, gate, judge, ladder and starter, on the same $1,000 ten-place table. The first running is seeded open
# and escrowed under bundle 9384cb71, so its bytes and its window are frozen: the seed refuses any change to a bundle an
# escrow holds, and an open escrow cannot be closed before its refund deadline. When the owner asked on 2026-11-14 for
# the bounty to start that day and run about 48 hours, threejs-fps-01's own window could not move, so the run is this
# second slug: it opens 2026-11-14T21:30:00Z for 48 hours, and threejs-fps-01 keeps its window and opens on
# 2026-11-16T17:00:00Z as planned.
#
# The owner asked for the bounty on 2026-11-13 ("Best threejs fps, csgo inspired") and for a second running starting
# that day for about 48 hours on 2026-11-14. This bundle is that second running: the same build, money and judging as
# threejs-fps-01's, over a 48-hour window instead of its 7 days.
#
# What wins, and what it beats. The best public starting points are three.js's own examples/games_fps (an
# octree-collision sphere-throwing demo with no opponents, rounds or HUD) and the browser shooters on GitHub, mostly
# unfinished prototypes or engine demos. An entry here must be a complete, original, OSI-licensed round-based tactical
# FPS with bots that runs offline from static files: two teams, short rounds won by eliminating the other team or by an
# objective, money and a buy menu between rounds, and gunfire where accuracy counts more than speed. It is
# Counter-Strike-STYLE, never a copy: the entrant's own map, art, sounds and names. The winner is a reusable
# open-source base for web FPS games, featured on make.fun's site and in its posts.
#
# Each entry's program, main.ts (Node 22), hands in a game it built: it copies game/ (the playable game as static ES
# modules) and screenshots/ (3 or 4 PNG or JPEG screens) from its repository to /output, and writes /output/dossier.json
# with vendor/makefun-threejs.ts buildDossier, the library the kit ships (sdk/threejs/makefun-threejs.ts, byte for byte
# the scorer's own copy). The sealed gate (scorer/score.ts, its limits reference/gate.json) checks six rows and writes
# valid; the judge, superbot at reasoning_effort high on superbot-router, reads two dossiers at a time (each its
# screenshots, then a text of the game's source capped at 163,840 bytes) and picks one with a margin from 1 to 5
# (verdict v2); the entries rank by win rate (resolution.method judges). The top 5 of the settled final heat are held
# up to 60 minutes for the make.fun team's finalist review (harness.judge.review), which plays each by serving game/
# with a static file server and opening index.html in desktop Chrome.
#
#   scorer/            score.ts (the six rows), images.ts (PNG and JPEG reading, roblox-2d-game-01's byte for byte),
#                      makefun-threejs.ts (the game reader and buildDossier) and vendor/acorn.mjs (acorn, pinned by its
#                      sha256); the scorer unit writes them to the settled design.
#   reference/         gate.json: game/ at most 993 files and directories together and 48 MiB in all, each path at
#                      most 1,000 UTF-8 bytes, game/index.html a regular file of at most 1 MiB, the sha256 of the kit's
#                      two three.js 0.187.0 files (npm's build/three.module.js and build/three.core.js, their names and
#                      the module's two ./three.core.js specifiers rewritten to ./three.core.min.js; the bytes are
#                      npm's own), 3 to 4 screenshots of at most 256 KiB, long side at most 1280 and short
#                      side at least 480 pixels, the dossier at most 1.5 MiB and its text at most 163,840 bytes
#                      (160 KiB).
#   judge/prompt.txt   the judge's persona and its rubric, five criteria ranked most important first and the close-pair
#                      rule, published word for word in the rules.
#   judge/anchors/     the four house games, weak to strong (1-weak, 2-plain, 3-mid, 4-strong), each a dossier as an
#                      entry writes one; 2-plain is the starter's own dossier, byte for byte.
#   ladder/            the calibrated dev ladder (harness.judge.ladder, below): calibration.json, the house's
#                      calibration heat over the four anchors and the three rungs, and rungs/5-pro.json,
#                      rungs/6-elite.json and rungs/7-ace.json; only a provisional heat reads it, never the final.
#   starter/           a working entry laid out as an entrant's repository (main.ts, serve.ts, vendor/makefun-threejs.ts,
#                      game/ with the kit's three.js 0.187.0 files under game/vendor/three/, three screenshots,
#                      shots.json and its LICENSE): a grey-box room with a rifle and target dummies whose dossier is
#                      byte for byte house game 2-plain, so handed in unchanged it plays as that game.
#
# Source and asset, what the judge reads: source is every .html .js .mjs .css .glsl .vert .frag .wgsl .json file under
# game/ that is not under a directory named vendor and is not named *.min.js/*.min.mjs/*.min.css; everything else under
# game/ is listed in the dossier's Game block by path and bytes and never read as text. The dossier's text is
# index.html first, then the JS modules a depth-first walk of static imports reaches from it, then the remaining source
# files by path, capped at 163,840 UTF-8 bytes with roblox-2d-game-01's cut rule (whole while it fits; the first that
# does not fit up to its last fitting line plus an "N lines hidden" line; one with no fitting line left out whole; a
# last line counting whole files and source bytes left out). The bytes are deterministic.
#
# The heat. Ten paid places, so the playoff is left unnamed: the last paid place and 2 more (judgePlayoffPlaces: 12),
# which load.ts judgePlayoffIssue takes. 6 Swiss rounds, the contract's default; playoff_repeats 1, so each of the 12
# plays the other 11 once. In development a valid entry's provisional heat plays the four house anchors and then 2
# adaptive rounds of 4 ladder games, 12 games and 24 judge calls (harness.judge.ladder's defaults, rounds 2 and games
# 4, at two calls a game), and its provisional rate shows at once (scores live). The final heat never reads the ladder.
# superbot is dialled on superbot-router alone and a router heat sends each call once (grader/judge-backup.ts
# judgeBackupRuleOf); an answer with no verdict is asked once more (grader/judge-call.ts JUDGE_CALL_ATTEMPTS 2). The
# rules say so.
#
# The ladder (harness.judge.ladder; grader/judge-ladder.ts, grader/judge-ladder-tree.ts). ladder/calibration.json is a
# heat record of stage calibration (agent-fun/judge-heat/v3) the house ran on 2026-11-13 with this judge, superbot at
# reasoning_effort high (its calls are stamped 2026-11-14T00:51:41Z to 2026-11-14T01:48:52.205Z UTC):
# `node --env-file=$HOME/.makefun/threejsfps-router.env cli/makefun.ts grade-local --kit .tmp/calibrate/threejs-fps-01
# --calibrate --rungs .tmp/calibrate/rungs --repeats 8 --seed 20261116 --save .tmp/calibrate/save`. Every pair of the
# seven members, the four anchors and the three rungs, played 8 games, each in both slot orders: 336 calls, 336
# attempts (one attempt a call, no resume, no resend, no spare), none invalid, $1.537804 metered, 57 minutes 11
# seconds, and in 168 of the 168 games both calls named the same winner. Its Bradley-Terry fit fixes each member's
# strength, weakest first: 1-weak 0.0038, 2-plain 0.0294, 3-mid 0.2121, 4-strong 1.2267, rungs/5-pro 2.5393,
# rungs/6-elite 5.4082 and rungs/7-ace 10.1583 (each beats the one below it with p 0.8863, 0.8783, 0.8526, 0.6743,
# 0.6805 and 0.6526), and the dispersion phi 0.100000000, the floor, pooled over the 9 informative pairs. A provisional
# heat's standard error is scaled by the square root of phi. The record was rebuilt from itself byte for byte with no
# model call (`grade-local --kit .tmp/calibrate/threejs-fps-01 --regrade-from .tmp/calibrate/save/calibration.json
# --rungs .tmp/calibrate/rungs --save .tmp/calibrate/regrade`, 1.65 s, "rebuilt from its record, no model called"):
# its calibration.json and all three rungs cmp byte-identical, the ladder tree's digest the same, and it is
# calibration record 69b5bff66c9e9d4129bdc3149b0ec8444201b11e65629e3c623d7fbfb13c3bf7. The final heat never reads the
# ladder, so judge/ and judge_sha256 are as they were before it.
#
# No spend cap: house judging has none (.cosmos/rules/grading.mdc: "no dollar cap on a judge"), and the contract makes
# max_total_usd and dev_daily_usd optional and read by nothing, kept only so an opened bundle that names them keeps its
# hash. So this new bundle names neither, and the rules name no cap.
#
# The tie-break: an exact tie on the win rate goes to the playoff games between the tied entries (head_to_head), then
# to the smaller dossier.json, the Size column (performance.judge.artifact_bytes, sorting asc,
# leaderboard.tie_break_index 4), then to the earlier receipt.
#
# The money and the dates: $1,000 in placement rewards, $400 / $200 / $120 and $40 each for 4th to 10th, one place per
# entrant; entries are open 48 hours, from opens_at 2026-11-14T21:30:00Z to the deadline 2026-11-16T21:30:00Z, the
