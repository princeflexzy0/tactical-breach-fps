# 2,000 entries (read 2026-11-13) at 2.44 h expected and 4.30 h worst, inside the 12-hour phase, and a judged final
# publishes once the heat and the checks after it are done, at whatever hour (server/competitions/lifecycle/auto.ts);
# the phase's end decides nothing. A longer phase would only move final_end and the resolve deadline later.
#
# The budget (grader/judge-call.ts judgePreflight, 3 bytes a token and every attempt at the full 12,100 output tokens,
# each call at most 2 attempts, and one call more than the heat plans, the room grader/worker.ts keeps for a call a
# fault sends again). The heaviest final pair, 4-strong (554,775 bytes) and rungs/5-pro (444,049 bytes), makes a request
# of 122,833 input tokens, $0.05137 at superbot's 2026-11-13 rates, so the final heat's 12,156 calls are a worst case
